<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Travel Companion</title>
    <style>
      :root {
        --bg: #0d1613; --panel: #142019; --panel-2: #1c2c24; --border: #294034;
        --text: #e8f1ec; --muted: #9db8ac; --accent: #33c98f; --accent-ink: #06231a;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg); color: var(--text); line-height: 1.5; }
      header { padding: 28px 20px 8px; text-align: center; }
      header h1 { margin: 0 0 4px; font-size: 24px; }
      header p { margin: 0; color: var(--muted); font-size: 14px; }
      .badge { display: inline-block; font-size: 11px; letter-spacing: .05em; text-transform: uppercase;
        color: var(--accent); background: #10251c; border: 1px solid var(--border); border-radius: 999px;
        padding: 3px 10px; margin-bottom: 10px; }
      main { max-width: 820px; margin: 0 auto; padding: 12px 20px 60px; display: grid; gap: 18px; }
      .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
      label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
      input, select { width: 100%; background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
        border-radius: 8px; padding: 10px 12px; font-size: 14px; font-family: inherit; }
      .grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; }
      .grid .field { min-width: 0; }
      button.go { width: 100%; margin-top: 14px; background: var(--accent); color: var(--accent-ink);
        font-weight: 600; border: none; border-radius: 8px; padding: 12px; font-size: 15px; cursor: pointer; }
      button.go:disabled { opacity: .55; cursor: default; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
      .chip { font-size: 13px; background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
        border-radius: 999px; padding: 6px 12px; cursor: pointer; }
      .chip:hover { border-color: var(--accent); }
      #result { display: none; }
      .signals { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
      .pill { font-size: 13px; background: var(--panel-2); border: 1px solid var(--border);
        border-radius: 999px; padding: 5px 12px; color: var(--text); }
      #plan { font-size: 15px; white-space: pre-wrap; }
      .places-title { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
        margin: 18px 0 8px; }
      .place { border-left: 3px solid var(--accent); background: var(--panel-2); padding: 8px 12px;
        border-radius: 0 8px 8px 0; margin-bottom: 8px; }
      .place b { font-size: 14px; } .place span { font-size: 12px; color: var(--muted); }
      .error { color: #ff8a6a; font-size: 14px; }
      footer { text-align: center; color: var(--muted); font-size: 12px; }
      .conv-row { display: flex; gap: 8px; align-items: center; }
      .conv-row input { flex: 1; }
      .conv-row select { width: auto; }
      .swap { background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
        border-radius: 8px; padding: 0 12px; height: 40px; cursor: pointer; font-size: 16px; }
      .conv-result { font-size: 28px; font-weight: 700; color: var(--accent); margin-top: 14px; }
      .conv-rate { font-size: 12px; color: var(--muted); margin-top: 4px; }
      .hero-label { font-size: 15px; color: var(--text); margin-bottom: 10px; font-weight: 600; }
      .divider { text-align: center; color: var(--muted); font-size: 12px; text-transform: uppercase;
        letter-spacing: .08em; margin: 4px 0; }
      @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header>
      <div class="badge">Powered by Claude</div>
      <h1>🧭 Travel Companion</h1>
      <p>Tell it where you are and what you've got to spend — get one AI-planned afternoon.</p>
    </header>

    <main>
      <div class="card">
        <div class="hero-label">💱 Instant converter — live rate, as you type</div>
        <div class="conv-row">
          <input id="cAmount" type="number" inputmode="decimal" value="300" />
          <select id="cFrom"></select>
          <button class="swap" id="cSwap" title="Swap">⇄</button>
          <select id="cTo"></select>
        </div>
        <div class="conv-result" id="cResult">—</div>
        <div class="conv-rate" id="cRate"></div>
      </div>

      <div class="divider">and plan your afternoon ↓</div>

      <div class="card">
        <div class="grid">
          <div class="field">
            <label for="city">City</label>
            <input id="city" placeholder="Bangkok" value="Bangkok" />
          </div>
          <div class="field">
            <label for="budget">Budget</label>
            <input id="budget" type="number" min="1" value="300" />
          </div>
          <div class="field">
            <label for="currency">Currency</label>
            <select id="currency">
              <option>MYR</option><option>SGD</option><option>USD</option>
              <option>EUR</option><option>GBP</option><option>AUD</option>
            </select>
          </div>
        </div>
        <div style="margin-top:12px">
          <label for="interests">What are you into? (optional)</label>
          <input id="interests" placeholder="cafes, art, street food…" />
        </div>
        <button class="go" id="goBtn">Plan my afternoon</button>
        <div class="chips" id="chips"></div>
      </div>

      <div class="card" id="result">
        <div class="signals" id="signals"></div>
        <div id="plan"></div>
        <div id="placesWrap"></div>
      </div>

      <footer>Integrates Open-Meteo (weather), open.er-api (currency), Geoapify (places) + Claude</footer>
    </main>

    <script>
      const EXAMPLES = [
        { city: "Bangkok", budget: 300, currency: "MYR", interests: "cafes, temples" },
        { city: "Singapore", budget: 100, currency: "SGD", interests: "art, hawker food" },
        { city: "Bali", budget: 500, currency: "MYR", interests: "beaches, coffee" },
      ];
      const $ = (id) => document.getElementById(id);
      const chipsEl = $("chips");
      EXAMPLES.forEach((e) => {
        const c = document.createElement("div");
        c.className = "chip";
        c.textContent = `${e.city} · ${e.budget} ${e.currency}`;
        c.onclick = () => { $("city").value = e.city; $("budget").value = e.budget;
          $("currency").value = e.currency; $("interests").value = e.interests; plan(); };
        chipsEl.appendChild(c);
      });

      async function plan() {
        const body = {
          city: $("city").value.trim(),
          budget: Number($("budget").value),
          currency: $("currency").value,
          interests: $("interests").value.trim(),
        };
        if (!body.city || !body.budget) return;

        const btn = $("goBtn");
        btn.disabled = true; btn.textContent = "Planning…";
        $("result").style.display = "block";
        $("signals").innerHTML = ""; $("placesWrap").innerHTML = "";
        $("plan").textContent = "Checking the weather, your budget, and what's nearby…";

        try {
          const res = await fetch("/api/plan", {
            method: "POST", headers: { "content-type": "application/json" },
            body: JSON.stringify(body),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Request failed");

          const s = data.signals;
          const pills = [
            `📍 ${s.place.name}, ${s.place.country}`,
            `${s.weather.rainLikely ? "🌧️" : "☀️"} ${s.weather.label}, ${s.weather.tempC}°C`,
            `💰 ${s.budget.home} ≈ ${s.budget.local}`,
          ];
          $("signals").innerHTML = pills.map((p) => `<span class="pill">${p}</span>`).join("");
          $("plan").textContent = data.plan;

          if (s.places && s.places.length) {
            $("placesWrap").innerHTML =
              '<div class="places-title">Live places nearby</div>' +
              s.places.slice(0, 6).map((p) =>
                `<div class="place"><b>${p.name}</b>${p.address ? ` <span>· ${p.address}</span>` : ""}</div>`
              ).join("");
          }
        } catch (err) {
          $("plan").innerHTML = '<span class="error">' + err.message + "</span>";
        } finally {
          btn.disabled = false; btn.textContent = "Plan my afternoon";
        }
      }
      $("goBtn").onclick = plan;

      // --- Instant converter (keyless, real-time) ---------------------------
      const CCY = ["MYR", "IDR", "SGD", "USD", "EUR", "GBP", "THB", "VND", "PHP", "JPY", "AUD", "KRW"];
      const cFrom = $("cFrom"), cTo = $("cTo"), cAmount = $("cAmount"),
        cResult = $("cResult"), cRate = $("cRate");
      CCY.forEach((c) => { cFrom.add(new Option(c, c)); cTo.add(new Option(c, c)); });
      cFrom.value = "MYR"; cTo.value = "IDR";
      let liveRate = null;

      function renderConv() {
        const amt = parseFloat(cAmount.value);
        if (liveRate == null || isNaN(amt)) { cResult.textContent = "—"; return; }
        cResult.textContent =
          (amt * liveRate).toLocaleString(undefined, { maximumFractionDigits: 2 }) + " " + cTo.value;
      }
      async function loadRate() {
        cRate.textContent = "Fetching live rate…";
        liveRate = null; renderConv();
        try {
          const r = await fetch(`/api/rate?from=${cFrom.value}&to=${cTo.value}`);
          const d = await r.json();
          if (!r.ok) throw new Error(d.error || "rate failed");
          liveRate = d.rate;
          cRate.textContent =
            `Live: 1 ${d.from} = ${d.rate.toLocaleString(undefined, { maximumFractionDigits: 4 })} ${d.to}` +
            (d.updated ? ` · updated ${d.updated}` : "");
          renderConv();
        } catch (e) { cRate.textContent = e.message; }
      }
      cAmount.addEventListener("input", renderConv);
      cFrom.onchange = loadRate;
      cTo.onchange = loadRate;
      $("cSwap").onclick = () => {
        const a = cFrom.value; cFrom.value = cTo.value; cTo.value = a; loadRate();
      };
      loadRate();
    </script>
  </body>
</html>
